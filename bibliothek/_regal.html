<title>Meine Bibliothek</title>
<meta name="description" content="Beide Bücher an einem Ort: Meine Kurse, zusammengefasst, und Krankheiten verstehen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Pinyon+Script&display=swap">
<style>
  /* Meine Bibliothek — seit 03.11.2026. Zwei geschlossene Bücher auf dem Tisch; ein Klick schlägt eines langsam auf. */
  :root{
    color-scheme:light;
    --ink:#170f07;--ink-soft:#3f3020;--accent:#b5561a;--gold:#e8c77c;
    --tisch:#d3c39d;--tisch-hell:#e3d6b4;--tisch-dunkel:#bfae86;
    --serif:"EB Garamond","Iowan Old Style",Georgia,serif;
    --display:"Cormorant Garamond","EB Garamond",Georgia,serif;
    --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  }
  html,body{height:100%;}
  body{margin:0;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 90% at 50% 38%,var(--tisch-hell) 0%,var(--tisch) 68%,var(--tisch-dunkel) 100%) fixed;}
  #regal{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(18px,4vh,40px);padding:28px 16px 34px;transition:opacity .6s ease;}
  #regal.gedimmt{opacity:0;pointer-events:none;}
  .rkopf{text-align:center;}
  .rkopf .kicker{font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;}
  .rkopf h1{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;margin:0;color:var(--accent);}
  .rkopf .schrift{font-family:var(--script);font-size:clamp(1.4rem,4vw,1.9rem);margin:2px 0 0;}
  .buecher{display:flex;justify-content:center;align-items:flex-start;gap:clamp(18px,6vw,84px);flex-wrap:wrap;}
  button.buch{--bw:clamp(128px,38vw,250px);display:flex;flex-direction:column;align-items:center;gap:16px;background:none;border:0;padding:0;
    cursor:pointer;font:inherit;color:inherit;text-align:center;width:calc(var(--bw) + 12px);}
  button.buch:focus-visible{outline:2px solid var(--accent);outline-offset:8px;border-radius:6px;}
  .koerper{position:relative;width:var(--bw);height:calc(var(--bw) * 1.42);transition:transform .45s cubic-bezier(.3,.7,.3,1);
    filter:drop-shadow(0 26px 22px rgba(45,28,8,.42)) drop-shadow(0 6px 8px rgba(45,28,8,.25));}
  .koerper::after{content:"";position:absolute;top:5px;bottom:5px;right:-9px;width:10px;border-radius:0 3px 3px 0;
    background:repeating-linear-gradient(90deg,#f4ead0 0 1px,#d7c497 1px 2px);box-shadow:inset -2px 0 3px rgba(80,55,20,.35);}
  button.buch:hover .koerper,button.buch:focus-visible .koerper{transform:translateY(-10px) rotate(-1.2deg);}
  button.buch.weg .koerper{visibility:hidden;}
  button.buch.laedt .koerper{animation:pochen 1.1s ease-in-out infinite;}
  @keyframes pochen{50%{transform:translateY(-6px) scale(1.015);}}
  .buch .unter b{display:block;font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.1;}
  .buch .unter span{display:block;font-size:14px;font-weight:500;color:var(--ink-soft);margin-top:3px;}
  .buch .unter i{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .rhinweis{font-style:italic;font-size:14px;font-weight:500;color:var(--ink-soft);margin:0;text-align:center;}

  /* Der Einband — auf dem Regal verkleinert, im Flug und im Buch in voller Größe; dieselbe Gestaltung wie .seite.deckel in den Büchern */
  .vorderseite{position:absolute;top:0;left:0;width:420px;height:596px;transform-origin:0 0;box-sizing:border-box;overflow:hidden;border-radius:2px 5px 5px 2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--gold);
    background:radial-gradient(120% 90% at 30% 18%,var(--d-hell) 0%,var(--d-mitte) 55%,var(--d-tief) 100%);
    box-shadow:inset 9px 0 12px -6px rgba(0,0,0,.5);}
  .vorderseite .rahmen{position:absolute;inset:18px;border:1px solid rgba(232,199,124,.55);outline:1px solid rgba(232,199,124,.3);outline-offset:-8px;pointer-events:none;}
  .vorderseite .kicker{font-size:11.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:rgba(232,199,124,.78);margin:0 0 8px;font-family:var(--serif);}
  .vorderseite h2{font-family:var(--display);font-weight:500;font-size:3.4rem;line-height:1;margin:8px 26px 0;color:#efd08a;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.4);}
  .vorderseite .schrift{font-family:var(--script);font-size:2rem;color:var(--gold);margin:4px 0 0;line-height:1.2;}
  .vorderseite .trenner{display:flex;align-items:center;gap:10px;width:min(80%,330px);margin:18px auto 16px;color:var(--gold);}
  .vorderseite .trenner span{flex:1;height:1px;background:var(--gold);opacity:.7;}
  .vorderseite .trenner i{font-style:normal;font-size:13px;}
  .vorderseite.flug{position:fixed;z-index:100;border-radius:0;box-shadow:inset 9px 0 12px -6px rgba(0,0,0,.5),0 30px 50px -20px rgba(40,20,5,.55);will-change:transform;}
  .kh-farben{--d-hell:#7a2219;--d-mitte:#5b1712;--d-tief:#3a0d09;}
  .zf-farben{--d-hell:#2f5c45;--d-mitte:#1e3b2c;--d-tief:#0e2017;}

  /* ===== Buch 1: Krankheiten verstehen (Styles aus krankheiten/index.html, auf #kh eingegrenzt) ===== */
/*__KH_CSS__*/
  /* ===== Buch 2: Meine Kurse (Styles aus zusammenfassungen/index.html, auf #zf eingegrenzt) ===== */
/*__ZF_CSS__*/

  /* Die Bücher liegen zu, bis eines aufgeschlagen wird */
  #kh,#zf{display:none;position:fixed;inset:0;z-index:30;}
  #kh.offen,#zf.offen{display:block;}
  #kh.vorbereiten,#zf.vorbereiten{opacity:0;pointer-events:none;}
  #kh.offen .leiste,#kh.offen .steuer,#zf.offen .leiste,#zf.offen .steuer{animation:einblenden .7s ease .1s both;}
  @keyframes einblenden{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){#regal{transition:none;} .koerper{transition:none;} button.buch.laedt .koerper{animation:none;}
    #kh.offen .leiste,#kh.offen .steuer,#zf.offen .leiste,#zf.offen .steuer{animation:none;}}
</style>

<main id="regal" lang="de">
  <header class="rkopf">
    <p class="kicker">Pflegeausbildung · 2. Lehrjahr</p>
    <h1>Meine Bibliothek</h1>
    <p class="schrift">zum Lesen und Lernen</p>
  </header>
  <div class="buecher">
    <button type="button" class="buch" data-buch="kurse" aria-label="Meine Kurse aufschlagen">
      <span class="koerper"><span class="vorderseite zf-farben"></span></span>
      <span class="unter"><b>Meine Kurse</b><span class="z1"></span><i class="z2"></i></span>
    </button>
    <button type="button" class="buch" data-buch="krankheiten" aria-label="Krankheiten verstehen aufschlagen">
      <span class="koerper"><span class="vorderseite kh-farben"></span></span>
      <span class="unter"><b>Krankheiten verstehen</b><span class="z1"></span><i class="z2"></i></span>
    </button>
  </div>
  <p class="rhinweis">Tippe auf ein Buch, um es aufzuschlagen. Zuklappen mit „Schließen ✕“ — beim nächsten Mal geht es dort weiter, wo du warst.</p>
</main>

<div class="buch-huelle" id="kh"><!--__KH_BODY__--></div>
<div class="buch-huelle" id="zf"><!--__ZF_BODY__--></div>

<script>
/* Das Regal: kennt die beiden Bücher, schlägt sie auf und klappt sie wieder zu. */
window.BIBLIOTHEK=(function(){
  'use strict';
  const B={}, HUELLE={krankheiten:'kh',kurse:'zf'};
  let offen=null, beschaeftigt=false;
  const ruhig=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const knopf=n=>document.querySelector('button.buch[data-buch="'+n+'"]');

  function fuelle(v,d){
    v.innerHTML='<span class="rahmen"></span><p class="kicker"></p><h2></h2><p class="schrift"></p><div class="trenner"><span></span><i>✦</i><span></span></div>';
    v.querySelector('.kicker').textContent=d.kicker;v.querySelector('h2').textContent=d.titel;v.querySelector('.schrift').textContent=d.schrift;
  }
  function masse(){
    document.querySelectorAll('button.buch').forEach(b=>{const k=b.querySelector('.koerper'),v=k.querySelector('.vorderseite');
      v.style.transform='scale('+(k.clientWidth/420)+','+(k.clientHeight/596)+')';});
  }
  function zeichne(){
    Object.keys(B).forEach(n=>{const b=knopf(n);if(!b)return;const a=B[n];
      fuelle(b.querySelector('.vorderseite'),a.deckel);
      let i={};try{i=a.info()||{};}catch(e){}
      b.querySelector('.z1').textContent=i.zeile||'';
      b.querySelector('.z2').textContent=(i.lesezeichen?'📑 Lesezeichen — weiter, wo du warst':'noch nicht aufgeschlagen')+(i.zweite?' · '+i.zweite:'');});
    masse();
  }
  /* Ein Einband in voller Größe, der vom Regal ins Buch fliegt (oder zurück) */
  function flug(n,ziel,von,hin){
    const v=document.createElement('div');v.className='vorderseite flug '+(n==='krankheiten'?'kh-farben':'zf-farben');fuelle(v,B[n].deckel);
    Object.assign(v.style,{left:ziel.left+'px',top:ziel.top+'px',width:ziel.width+'px',height:ziel.height+'px'});
    document.body.append(v);
    const klein='translate('+(von.left-ziel.left)+'px,'+(von.top-ziel.top)+'px) scale('+(von.width/ziel.width)+','+(von.height/ziel.height)+')';
    const k=hin?[{transform:klein},{transform:'none'}]:[{transform:'none'},{transform:klein}];
    if(ruhig()||!v.animate)return {el:v,fertig:Promise.resolve()};
    const a=v.animate(k,{duration:1100,easing:'cubic-bezier(.33,.0,.2,1)',fill:'forwards'});
    return {el:v,fertig:a.finished.catch(()=>{})};
  }
  async function oeffne(n){
    if(beschaeftigt||offen||!B[n])return;beschaeftigt=true;
    const b=knopf(n),a=B[n],h=document.getElementById(HUELLE[n]);
    b.classList.add('laedt');
    h.classList.add('offen','vorbereiten');
    try{await a.vorbereiten();}catch(e){console.error(e);h.classList.remove('offen','vorbereiten');b.classList.remove('laedt');beschaeftigt=false;return;}
    const ziel=a.ziel();
    b.classList.remove('laedt');
    const von=b.querySelector('.koerper').getBoundingClientRect();
    const f=flug(n,ziel,von,true);
    b.classList.add('weg');
    document.getElementById('regal').classList.add('gedimmt');
    await f.fertig;
    a.ziel();
    h.classList.remove('vorbereiten');
    offen=n;
    requestAnimationFrame(()=>{f.el.remove();a.oeffne(()=>{beschaeftigt=false;});});
  }
  function schliesse(){
    if(!offen||beschaeftigt)return;beschaeftigt=true;
    const n=offen,a=B[n],b=knopf(n),h=document.getElementById(HUELLE[n]);
    a.schliesse(async()=>{
      const r=a.rechteck();
      zeichne();
      document.getElementById('regal').classList.remove('gedimmt');
      const von=b.querySelector('.koerper').getBoundingClientRect();
      const f=flug(n,r,von,false);
      h.classList.remove('offen');
      await f.fertig;
      b.classList.remove('weg');f.el.remove();
      offen=null;beschaeftigt=false;b.focus({preventScroll:true});
    });
  }
  document.addEventListener('click',e=>{const b=e.target.closest('button.buch[data-buch]');if(b)oeffne(b.dataset.buch);});
  window.addEventListener('resize',masse);
  return {melde:(n,a)=>{B[n]=a;},schliesse,zeichne};
})();
</script>

</script>

<script>
(function(){const los=()=>BIBLIOTHEK.zeichne();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(los);los();})();
